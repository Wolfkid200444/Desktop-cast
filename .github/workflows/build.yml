name: Test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libpulse0
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          PULSE_SERVER: unix:/tmp/desktop-cast-no-audio
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ruby-dev rpm squashfs-tools libegl1 libopengl0 libxkbcommon0 libpulse0
      - run: pip install -r requirements-build.txt
      - run: sudo gem install fpm -v 1.16.0 --no-document
      - name: Install AppImage tool
        run: |
          curl -fL https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - run: packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-cast-linux-x86_64
          path: artifacts/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-cast-linux-x86_64
          path: artifacts
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --title "Desktop Cast $RELEASE_TAG" --generate-notes
